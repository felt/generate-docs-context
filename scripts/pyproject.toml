[project]
name = "generate-docs-context"
version = "0.1.0"
description = "Build a single markdown corpus from a documentation repository"
requires-python = ">=3.13"
dependencies = []

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.12.8"]

[project.scripts]
build-corpus = "src.build_corpus:main"
